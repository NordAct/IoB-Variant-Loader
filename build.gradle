buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            //args '-Dgeckolib.disable_examples=true'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            //args '--nogui'
            //args '-Dgeckolib.disable_examples=true'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            forRepositories(fg.repository) // Only add this if you're using ForgeGradle, otherwise remove this line
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
}

dependencies {
    //required
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.18:3.0.46')
    //implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.18:3.0.57')
    implementation fg.deobf("maven.modrinth:isle-of-berk:1.2.0")

    implementation fg.deobf("maven.modrinth:jade:5.3.2")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        jarJar.ranged(it, "[0.5.0,)")
    }

    //test mods
    implementation fg.deobf("maven.modrinth:rubidium:0.5.6")
    implementation fg.deobf("maven.modrinth:oculus:1.18.2-1.6.4")
    //implementation fg.deobf("maven.modrinth:spark:1.9.11-forge")
    implementation fg.deobf("maven.modrinth:archipelago-additions:2.4.0-1.18.2")
    implementation fg.deobf("maven.modrinth:isle-of-berk-addons:1.1d")
    implementation fg.deobf("maven.modrinth:debugutils:A0WvBW2D")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "isle-of-berk-variant-loader"
    versionNumber = mod_version
    uploadFile = jar.outputs.getFiles().asPath.replace(".jar", "-all.jar") //yet another "Fuck you" award goes to Forge
    gameVersions = ["1.18.2"]
    loaders = ["forge"]
    dependencies {
        required.project "isle-of-berk"
    }
    syncBodyFrom = rootProject.file("README.md").text
    changelog = rootProject.file("CHANGELOG.md").text
    versionName = "Isle of Berk Variant Loader " + mod_version
    versionType = "release"
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    int projectId = 908401
    String changelogText = rootProject.file("CHANGELOG.md").text
    def mainFile = upload(projectId, jar.outputs.getFiles().asPath.replace(".jar", "-all.jar"))
    mainFile.changelog = changelogText
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("1.18.2")
    mainFile.displayName = "Isle of Berk Variant Loader " + mod_version
    mainFile.releaseType = "release"
    mainFile.addEnvironment("client", "server")
}
